services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    volumes:
      - qdrant_storage:/qdrant/storage
    # not published — only reachable inside the compose network
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backs LiteLLM: virtual keys, budgets, per-key spend (ADR-0006)
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_PG_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - litellm_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # not published — only the gateway and the agent reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    command: ["--config", "/config.yaml", "--port", "4000"]
    volumes:
      - ./gateway/litellm-config.yaml:/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_PG_PASSWORD}@postgres:5432/litellm
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000" # exposed for local inspection; keep internal in production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build: services/mcp-qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
    volumes:
      # corpus for `docker compose exec mcp python ingest.py`
      - ./README.md:/corpus/README.md:ro
      - ./docs:/corpus/docs:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    build: services/agent
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      # chat (Claude) | chat-mini | chat-openai — provider swap without code changes
      LLM_MODEL: ${LLM_MODEL:-chat}
      MCP_URL: http://mcp:8080/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      # session checkpoints (ADR-0007); unset → in-memory fallback
      CHECKPOINT_DB_URL: postgresql://litellm:${LITELLM_PG_PASSWORD}@postgres:5432/agent_state
      A2A_AUTH_TOKEN: ${A2A_AUTH_TOKEN}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      litellm:
        condition: service_healthy
      mcp:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-writer:
    build: services/agent-writer
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-chat}
      A2A_AUTH_TOKEN: ${A2A_AUTH_TOKEN}
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # user-facing agent: discovers specialists via A2A agent cards (ADR-0008)
  orchestrator:
    build: services/orchestrator
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-chat}
      A2A_AGENT_URLS: http://agent:8000,http://agent-writer:8000
      A2A_AUTH_TOKEN: ${A2A_AUTH_TOKEN}
    depends_on:
      agent:
        condition: service_healthy
      agent-writer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: apps/web
    environment:
      AGENT_URL: http://orchestrator:8000
    ports:
      - "3000:3000"
    depends_on:
      orchestrator:
        condition: service_healthy

volumes:
  qdrant_storage:
  litellm_pg:
